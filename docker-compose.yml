# =============================================================================
# docker-compose.yml
# RÔLE : INFRASTRUCTURE LOCALE UNIQUEMENT (PostgreSQL + MinIO + Adminer)
# Usage : docker compose up -d
# Les apps (web :3000, api :3003, ai-service :8001) tournent sur le HOST via
# `pnpm dev` / `uvicorn` — voir docs/development.md.
# Pour le stack entièrement conteneurisé (prod-like), voir docker-compose.prod.yml.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: angaly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: angaly_user
      POSTGRES_PASSWORD: angaly_pass
      POSTGRES_DB: angaly_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U angaly_user -d angaly_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: angaly_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  minio:
    image: minio/minio:latest
    container_name: angaly_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: angaly_minio
      MINIO_ROOT_PASSWORD: changeme-minio-root-password
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: angaly_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: angaly_minio
      MINIO_ROOT_PASSWORD: changeme-minio-root-password
    entrypoint: ['/bin/sh', '/init-buckets.sh']
    volumes:
      - ./docker/minio/init-buckets.sh:/init-buckets.sh:ro
    restart: 'no'

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: angaly_network
