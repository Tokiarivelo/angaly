# ANGALY — production reverse proxy
# TLS termination happens here (see docs/deployment.md for cert setup).
# Adjust `server_name` and the certificate paths for the target domain.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name angaly.mg www.angaly.mg;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # NextAuth's own routes live under /api/auth/* on the Next.js side — this
    # more specific prefix wins over the /api/ block below regardless of
    # declaration order (nginx always matches the longest prefix location).
    location /api/auth/ {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NestJS API (global prefix /api) and its Swagger UI (dev-only, disabled in prod)
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js (everything else, including NextAuth's own /api/auth/* routes,
    # which Next.js handles internally — this location only forwards the
    # NestJS-prefixed /api/ above, never intercepts /api/auth/*).
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
