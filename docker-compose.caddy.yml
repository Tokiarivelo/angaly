# =============================================================================
# docker-compose.caddy.yml
# RÔLE : Proxy HTTPS local optionnel — à combiner avec docker-compose.yml
# Usage : docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
# Voir docker/caddy/Caddyfile pour le détail des routes.
# =============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: angaly_caddy
    restart: unless-stopped
    ports:
      - '443:443'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
